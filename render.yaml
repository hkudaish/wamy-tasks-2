# مخطط النشر على Render — نظام إدارة ومتابعة المهام (وامي)
#
# الاستخدام: في Render اختر New → Blueprint واربط المستودع.
# القيم المعلَّمة بـ sync:false يطلبها Render منك عند الإنشاء ولا تُحفظ في المستودع.
#
# ملاحظة عن قاعدة البيانات: نستخدم Supabase الخارجية، لا قاعدة من Render.
#   DATABASE_URL يجب أن يشير إلى Transaction pooler على المنفذ 6543:
#   postgresql://postgres.<ref>:<كلمة-المرور>@aws-0-<region>.pooler.supabase.com:6543/postgres
#   انسخه من لوحة Supabase حرفيًا — بادئة المضيف تختلف بين المشاريع (aws-0 / aws-1).
#   ورمّز الرموز الخاصة: %→%25  @→%40  #→%23  /→%2F
#
# المرفقات: Supabase Storage (bucket خاص) — راجع server/storage.js.
# التوقيت: TZ للحاوية، وبقاعدة البيانات نفّذ مرة واحدة:
#   ALTER DATABASE postgres SET timezone = 'Asia/Riyadh';

services:
  - type: web
    name: wamy-tasks
    runtime: docker
    plan: starter              # المجانية تنام بعد 15 دقيقة فيتعطّل الملخص اليومي
    region: frankfurt          # الأقرب للسعودية من المتاح
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ---- قاعدة البيانات (سرّية — تُدخَل عند الإنشاء) ----
      - key: DATABASE_URL
        sync: false
      - key: PG_SSL
        value: "true"
      - key: PG_POOL_MAX
        value: "5"             # منخفض عمدًا: المجمِّع يتولى التوزيع

      # ---- الجلسة والأمان ----
      - key: SESSION_SECRET
        generateValue: true    # يولّده Render عشوائيًا وآمنًا
      - key: COOKIE_SECURE
        value: "true"          # إلزامي على HTTPS
      - key: TRUST_PROXY
        value: "1"             # خلف وسيط Render — بدونه يتعطّل حدّ المحاولات
      - key: LOCK_MAX_FAILS
        value: "5"
      - key: LOCK_WINDOW_MIN
        value: "15"

      # ---- التطبيق ----
      - key: NODE_ENV
        value: production
      # PORT: لا تُعرَّف — Render تحقنها (10000 افتراضيًا)
      #        والكود يقرأ process.env.PORT || 3000 فيحترمها
      - key: APP_URL
        sync: false            # https://<اسم-الخدمة>.onrender.com
      - key: ALLOWED_DOMAIN
        value: wamy.org
      - key: ADMIN_EMAIL
        value: admin@wamy.org
      - key: DIGEST_HOUR
        value: "7"
      - key: MAX_UPLOAD_MB
        value: "20"   # مطابق للبيئة المحلية؛ لا يمر عبر حدود دوال عديمة الخادم
      - key: TZ
        value: Asia/Riyadh      # الحاوية UTC افتراضيًا فينزاح الملخص اليومي 3 ساعات

      # ---- تخزين المرفقات على Supabase Storage ----
      # لا حاجة لقرص دائم: الملفات خارج الحاوية وتنجو من كل نشر
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: task-attachments
      - key: SUPABASE_SIGN_TTL
        value: "60"


    # ---- لا قرص دائم ----
    # المرفقات تُخزَّن في Supabase Storage، فلا حاجة إلى disk نهائيًا.
