  <div class="card-b" style="display:grid;gap:12px">${orgsShown.length?'':'<div class="empty">لا توجد نتائج مطابقة للبحث.</div>'}${orgsShown.map(o=>{
    const us=STRUCTURE_PEOPLE.filter(u=>u.organization===o.id);
    const ds=DEPTS.filter(d=>d.organization===o.id).filter(d=>!q||oMatch(o)||dMatch(d)||deptPeople(d).some(pMatch));
    const dirs=us.filter(u=>u.role==='director');
    return `<div style="border:1px solid var(--border);border-radius:10px;padding:12px"><div style="display:flex;align-items:center;gap:8px"><span class="t-meta">اسم الإدارة</span><b class="org-title">${structHL(organizationDisplayName(o),STRUCT_Q)}</b><span class="badge b-blue">${nfm(us.length)} مستخدم</span><span style="flex:1"></span><button class="btn ghost sm" onclick="editOrgUnit('organization','${o.id}')">تعديل</button><button class="btn ghost sm" onclick="addDepartment('${o.id}')">＋ قسم / وحدة</button><button class="tag-del" title="حذف الإدارة كاملة" onclick="delOrganization('${o.id}')">✕</button></div>
      ${dirs.length?`<div class="org-director"><span>مدير الإدارة</span><b>${dirs.map(u=>structHL(u.name,STRUCT_Q)).join('، ')}</b>${(()=>{const n=Math.max(0,...dirs.map(u=>{const uu=structurePersonUser(u);return uu?ORGANIZATIONS.filter(x=>x.director===uu.id).length:0}));return n>1?'<span class="pc-no">يتولى '+nfm(n)+' إدارات</span>':''})()}${q&&dirs.some(u=>structNorm(String(u.employeeNo||'')).includes(q))?`<span class="pc-no">${dirs.map(u=>structHL(String(u.employeeNo||''),STRUCT_Q)).join('، ')}</span>`:''}</div>`:'<div class="org-director no-dir"><span>مدير الإدارة</span><b>غير محدد</b></div>'}
      ${(()=>{if(!q)return '';const loose=us.filter(u=>!u.dept&&pMatch(u)&&!dirs.some(d=>d.id===u.id));
        return loose.length?`<div class="person-chips">${loose.map(structPersonChip).join('')}</div>`:'';})()}
      <div style="display:grid;gap:8px;margin-top:10px">${ds.map(d=>{const du=deptPeople(d).filter(u=>!q||oMatch(o)||dMatch(d)||pMatch(u)),p=unitParts(d.name);return `<div style="background:var(--surface2);padding:9px;border-radius:8px"><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap"><span class="t-meta">القسم</span><b>${structHL(p.section,STRUCT_Q)}</b>${p.unit?`<span class="t-meta">الوحدة</span><b>${structHL(p.unit,STRUCT_Q)}</b>`:''}<span class="t-meta">${nfm(du.length)} موظف</span><span style="flex:1"></span><button class="btn ghost sm" onclick="editOrgUnit('department','${d.id}')">تعديل</button><button class="tag-del" onclick="delDepartment('${d.id}')">✕</button></div><div class="person-chips">${du.map(structPersonChip).join('')||'<span class="t-meta">لا يوجد موظفون</span>'}</div></div>`}).join('')||'<div class="hint">لا توجد أقسام أو وحدات بعد.</div>'}</div>
      </div>`}).join('')}</div></div>`;

function userPermissionLevel(role){
  if(['admin','secretary_general','assistant_secretary_general'].includes(role))return 'executive';
  if(['director','manager'].includes(role))return 'management';

function addUser(){

/* ---------- المهام المتكررة ---------- */
const RECUR_STEP={daily:1,weekly:7,monthly:30,quarterly:91,yearly:365};
const RECUR_AR={daily:'يومية',weekly:'أسبوعية',monthly:'شهرية',quarterly:'ربع سنوية',yearly:'سنوية'};
function spawnRecur(t){
  if(!t.recur || t.recurDone) return null;
  const step=RECUR_STEP[t.recur]||30;
  t.recurDone=true;
  const nt=T({
    title:t.title, desc:t.desc, pri:t.pri, cat:t.cat, dept:t.dept,
    assignee:t.assignee, creator:t.creator,
    created:iso(TODAY),
    start:iso(new Date(parse(t.start).getTime()+step*MS)),
    est:t.est, durationValue:taskDurationValue(t), durationUnit:taskDurationUnit(t),
    due:iso(new Date(parse(t.due).getTime()+step*MS)),
    status:'new', progress:0, notes:'', recur:t.recur,
    subtasks:(t.subtasks||[]).map((x,i)=>({id:i+1,title:x.title,done:false})),
    parentRecur:t.id
  });
  nt.log=[{at:new Date().toISOString(),by:ME?ME.id:t.creator,type:'create',
           txt:`أُنشئت تلقائيًا كتكرار ${RECUR_AR[t.recur]} للمهمة ${t.id} — الاستحقاق ${fmtDate(nt.due)}`}];
  nt.updated=new Date().toISOString();
  logAdd(t,'edit',`تم توليد التكرار التالي تلقائيًا: ${nt.id} (${RECUR_AR[t.recur]})`);
  toast(`أُنشئت المهمة المتكررة التالية: ${nt.id}`);
  return nt;
}

/* ---------- إجراءات المهمة ---------- */
function setProgress(v){
  const t=CUR, old=t.progress; t.progress=v;
  logAdd(t,'progress',`حدّث نسبة الإنجاز من ${old}% إلى ${v}%`);
  if(v===100 && t.status!=='done'){ t.status='approval'; logAdd(t,'status','بلغت النسبة 100% — الحالة إلى «بانتظار اعتماد»'); }
  else if(v>0 && ['new','notstarted'].includes(t.status)){ t.status='inprogress'; }
  drawTask(); render(); toast('حُدّثت نسبة الإنجاز');
}
function setStatus(v){
  const t=CUR, old=ST(effStatus(t)).name;
  t.status=v;
  if(v==='done'){ t.progress=100; t.closed=iso(TODAY); }
  else t.closed=null;
  logAdd(t,'status',`غيّر الحالة من «${old}» إلى «${ST(v).name}»`);
  if(v==='done') spawnRecur(t);
  drawTask(); render(); toast('تم تغيير الحالة');
}
function quickDone(){
  const t=CUR;
  if(ME.role==='employee'){ t.status='approval'; t.progress=100; logAdd(t,'status','سجّل اكتمال المهمة — بانتظار اعتماد المدير');
    notify('approval',t.id,`«${t.title}» بانتظار اعتماد الإغلاق — أنهاها ${ME.name}`,[...deptManagers(t.dept),t.creator]);
    toast('أُرسلت للاعتماد'); }
  else { t.status='done'; t.progress=100; t.closed=iso(TODAY); logAdd(t,'done','اعتمد اكتمال المهمة وأغلقها'); spawnRecur(t); toast('أُغلقت المهمة'); }
  drawTask(); render();
}
function approveClose(){
  const t=CUR;
  t.status='done'; t.progress=100; t.closed=iso(TODAY);
  logAdd(t,'done','اعتمد إغلاق المهمة');
  notify('approved',t.id,`اعتُمد إغلاق مهمتك «${t.title}»`,[t.assignee]);
  if(t.quality==null){
    const q=prompt('قيّم جودة التنفيذ (5 ممتاز، 4 جيد جدًا، 3 جيد، 2 يحتاج متابعة، 1 ضعيف):','4');
    if(q&&+q>=1&&+q<=5){ t.quality=+q; logAdd(t,'edit',`قيّم جودة التنفيذ: ${['','ضعيف','يحتاج متابعة','جيد','جيد جدًا','ممتاز'][+q]}`); }
  }
  spawnRecur(t);
  drawTask(); render(); toast('اعتُمد الإغلاق');
}
function rejectClose(){
  const t=CUR;
  const r=prompt('سبب الإرجاع للتنفيذ (يُسجَّل في سجل المهمة):');
  if(!r){ toast('الإرجاع يتطلب سببًا'); return; }
  t.status='inprogress'; t.progress=Math.min(t.progress,90); t.closed=null;
  logAdd(t,'status','أرجع المهمة للتنفيذ — السبب: '+r);
  notify('rejected',t.id,`أُرجعت مهمتك «${t.title}» للتنفيذ — السبب: ${r}`,[t.assignee]);
  drawTask(); render(); toast('أُرجعت للتنفيذ');
}
function reopenTask(){
  const t=CUR;
  const r=prompt('سبب إعادة فتح المهمة المكتملة:');
  if(!r){ toast('إعادة الفتح تتطلب سببًا موثقًا'); return; }
  t.status='inprogress'; t.closed=null; t.progress=Math.min(t.progress,85);
  logAdd(t,'status','أعاد فتح المهمة بعد اكتمالها — السبب: '+r);
  notify('reopen',t.id,`أُعيد فتح المهمة «${t.title}» — السبب: ${r}`,[t.assignee,t.creator]);
  drawTask(); render(); toast('أُعيد فتح المهمة');
}
function askExtend(){
  const t=CUR;
  const nd=prompt('الموعد النهائي الجديد (YYYY-MM-DD):', t.due); if(!nd) return;
  const rs=prompt('سبب التمديد (إلزامي للتوثيق):'); if(!rs){ toast('التمديد يتطلب سببًا موثقًا'); return; }
  t.ext.push({from:t.due,to:nd,reason:rs,by:ME.id,at:iso(TODAY)});
  logAdd(t,'extend',`مدّد الموعد من ${fmtDate(t.due)} إلى ${fmtDate(nd)} — السبب: ${rs}`);
  notify('extend',t.id,`مُدِّد موعد «${t.title}» إلى ${fmtDate(nd)} — السبب: ${rs}`,[t.assignee,t.creator,...deptManagers(t.dept)]);
  t.due=nd; if(effStatus(t)!=='late'&&t.status==='late') t.status='inprogress';
  drawTask(); render(); toast('سُجّل التمديد في سجل المهمة');
}
function reassign(){
  const t=CUR;
  const names=USERS.map((u,i)=>`${i+1}) ${u.name}`).join('\n');
  const n=prompt('اختر رقم الموظف الجديد:\n'+names); if(!n) return;
  const u=USERS[+n-1]; if(!u) return;
  logAdd(t,'assign',`أعاد إسناد المهمة من ${uname(t.assignee)} إلى ${u.name}`);
  const prev=t.assignee;
  t.assignee=u.id; t.dept=u.dept;
  notify('assign',t.id,`أُسندت إليك المهمة «${t.title}» — الاستحقاق ${fmtDate(t.due)}`,[u.id]);
  notify('assign',t.id,`نُقلت المهمة «${t.title}» منك إلى ${u.name}`,[prev]);
  drawTask(); render(); toast('أُعيد الإسناد');
}
function saveNotes(v){ CUR.notes=v; logAdd(CUR,'edit','حدّث ملاحظات التنفيذ'); toast('حُفظت الملاحظات'); }
function saveDelay(v){ CUR.delayReason=v; logAdd(CUR,'edit','وثّق سبب التأخير'); toast('حُفظ السبب'); }

function addComment(){
  const b=document.getElementById('cmtBox'); if(!b.value.trim()) return;
  const t=CUR, txt=b.value.trim();
  const tagged=USERS.filter(u=>txt.includes('@'+u.name)).map(u=>u.id);
  t.comments.push({id:Date.now(),user:ME.id,at:new Date().toISOString(),text:txt,mentions:tagged,parent:REPLY_TO});
  logAdd(t,'comment',(REPLY_TO?'ردّ على تعليق':'أضاف تعليقًا')+(tagged.length?` وأشار إلى ${tagged.map(uname).join('، ')}`:''));
  notify('comment',t.id,`${ME.name} ${REPLY_TO?'ردّ':'علّق'} على «${t.title}»: ${txt.slice(0,70)}${txt.length>70?'…':''}`,[t.assignee,t.creator]);
  if(tagged.length) notify('mention',t.id,`أشار إليك ${ME.name} في «${t.title}»`,tagged);
  REPLY_TO=null;
  drawTask(); render(); toast(tagged.length?'أُضيف التعليق وأُرسل تنبيه للمذكورين':'أُضيف التعليق');

function addSub(){
  const n=prompt('عنوان الخطوة:'); if(!n) return;
  CUR.subtasks.push({id:Date.now(),title:n,done:false}); syncSub(); drawTask();
}
function t_delSub(i){ CUR.subtasks.splice(i,1); syncSub(); drawTask(); }
function toggleSub(i){ CUR.subtasks[i].done=!CUR.subtasks[i].done; syncSub(); drawTask(); render(); }
function syncSub(){
  const t=CUR;
  if(CFG.progressFromSubtasks && t.subtasks.length){
    t.progress=Math.round(t.subtasks.filter(s=>s.done).length/t.subtasks.length*100);
    logAdd(t,'progress',`تحديث تلقائي لنسبة الإنجاز من المهام الفرعية: ${t.progress}%`);
  }
}
const fmtSize = b => b<1024?b+' ب':b<1048576?(b/1024).toFixed(0)+' ك.ب':(b/1048576).toFixed(1)+' م.ب';
function uploadAttach(inp){
  const files=[...inp.files]; if(!files.length) return;
  let pending=files.length;
  files.forEach(f=>{
    const meta={name:f.name,size:f.size,type:f.type,by:ME.id,at:new Date().toISOString(),data:null};
    if(f.size<=350*1024){
      const r=new FileReader();
      r.onload=()=>{ meta.data=r.result; done(); };

/* ============================================================
   طبقة الاتصال بالخادم — نسخة الإنتاج
   تستبدل التخزين المحلي بواجهات API، وتُبقي منطق العرض كما اعتُمد.
   المصدر الوحيد للحقيقة هو الخادم: التأخير والتقييم والصلاحيات
   تُحتسب هناك، والعميل يعرض فقط.
   ============================================================ */
const API = {
  async req(method, url, body, isForm) {
    const opt = { method, credentials: 'same-origin', headers: {} };
    if (isForm) opt.body = body;
    else if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    let r;
    try { r = await fetch('/api' + url, opt); }
    catch (e) { throw new Error('تعذّر الاتصال بالخادم. تحقق من الشبكة.'); }
    if (r.status === 401) { sessionExpired(); throw new Error('__session__'); }
    const ct = r.headers.get('content-type') || '';
    const d = ct.includes('json') ? await r.json().catch(() => null) : null;
    if (!r.ok) throw new Error((d && d.error) || `تعذّر تنفيذ الطلب (${r.status})`);
    return d;
  },
  get: (u) => API.req('GET', u),
  post: (u, b) => API.req('POST', u, b),
  put: (u, b) => API.req('PUT', u, b),
  patch: (u, b) => API.req('PATCH', u, b),
  del: (u) => API.req('DELETE', u),
  form: (u, fd) => API.req('POST', u, fd, true),
};

let BUSY = 0;
function busy(on) {
  BUSY += on ? 1 : -1;
  document.body.style.cursor = BUSY > 0 ? 'progress' : '';
}
/** تنفيذ آمن: يعرض رسالة الخادم عند الرفض بدل الفشل الصامت */
async function run(fn, okMsg) {
  busy(true);
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { if (e.message !== '__session__') toast(e.message); return null; }
  finally { busy(false); }
}
function sessionExpired() {
  if (!ME) return;
  ME = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('lgErr').textContent = 'انتهت الجلسة بسبب الخمول. يُرجى تسجيل الدخول مجددًا.';
}

/* ============================================================
   معالج إنشاء المهمة (Wizard)
   نطاق الإسناد مطابق لقاعدة canAssignTo في الخادم، والخادم يعيد
   التحقق منه عند الإنشاء، فالواجهة لا تمنح صلاحية لا يملكها المستخدم.
   ============================================================ */
const WZ_TITLES = ['المسؤولون', 'وصف المهمة', 'الموعد والأهمية', 'مراجعة وإرسال'];
let WZ = null;

function assignableUsers() {
  if (!ME) return [];
  const self = hasUserPermission(ME, 'create_self') ? USERS.filter(u => u.id === ME.id) : [];
  let others = [];
  if (hasUserPermission(ME, 'assign_others')) {
    if (ME.role === 'admin') others = USERS.filter(u => ['manager', 'employee'].includes(u.role));
    else if (['secretary_general', 'assistant_secretary_general'].includes(ME.role))
      others = USERS.filter(u => u.role === 'director' && (!ME.organization || u.organization === ME.organization));
    else if (ME.role === 'director')
      others = USERS.filter(u => inMyOrgs(u.organization) && ['manager', 'employee', 'consultant'].includes(u.role));
    else if (ME.role === 'manager')
      others = USERS.filter(u => u.role === 'employee' && u.dept === ME.dept);
  }
  return [...new Map([...self, ...others].map(u => [u.id, u])).values()]
    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ar'));
}

/* اللقب والتحية. لا يوجد حقل «الجنس» في قاعدة البيانات، فيُستنتج من الاسم
   والمسمى — إضافة الحقل تجعل النتيجة قطعية بدل الاستنتاج. */
function wzIsDoctor(u) { return /(^|\s)(د\.|دكتور|دكتورة|الدكتور|الدكتورة)/.test(`${u.name || ''} ${u.title || ''}`); }
function wzIsFemale(u) {
  const n = String(u.name || '').trim(), t = String(u.title || '');
  if (/دكتورة|أستاذة|السيدة|الآنسة/.test(t)) return true;
  if (/(^|\s)بنت(\s|$)/.test(n)) return true;
  if (/(^|\s)بن(\s|$)/.test(n)) return false;
  const first = n.split(/\s+/)[0].replace(/^(د\.?|أ\.?)/, '');
  if (/^(عبد|أبو|ابو|آل)/.test(first)) return false;
  return /(ة|اء|ى)$/.test(first);
}
function wzHonorific(u) { const f = wzIsFemale(u); return wzIsDoctor(u) ? (f ? 'دكتورة' : 'دكتور') : (f ? 'أستاذة' : 'أستاذ'); }
function wzFirstName(u) {
  return String(u.name || '').trim().replace(/^(الدكتورة|الدكتور|الأستاذة|الأستاذ|د\.?|أ\.?)\s*/, '').split(/\s+/)[0] || '';
}
function wzIsMorning() { const h = new Date().getHours(); return h >= 4 && h < 12; }
function wzOrgName(id) { return (ORGANIZATIONS.find(o => o.id === id) || {}).name || '—'; }
function wzCanEditDue() { return hasUserPermission(ME, 'manage_tasks'); }

/* حفظ مؤقت لبيانات الخطوة الحالية حتى لا تُفقد عند التنقل */
function wzCapture() {
  if (!WZ) return;
  const g = x => { const el = document.getElementById(x); return el ? el.value : null; };
  if (WZ.step === 2) {
    const t = g('wzTitle'); if (t !== null) WZ.title = t.trim();
    const d = g('wzDesc'); if (d !== null) WZ.desc = d;
  }
  if (WZ.step === 3) {
    WZ.start = g('wzStart') || WZ.start;
    WZ.est = Math.max(1, +g('wzEst') || 1);
    WZ.durationUnit = TASK_DURATION_UNITS[g('wzEstUnit')] ? g('wzEstUnit') : WZ.durationUnit;
    WZ.due = g('wzDue') || WZ.due;
    WZ.pri = g('wzPri') || WZ.pri;
    WZ.cat = g('wzCat') || WZ.cat;
  }
}
function wzGo(n) {
  wzCapture();
  if (n > WZ.step) {
    if (WZ.step === 1 && !WZ.assignees.length) { toast('اختر مسؤولًا واحدًا على الأقل'); return; }
    if (WZ.step === 2 && !WZ.title) { toast('اسم المهمة مطلوب'); return; }
    if (WZ.step === 3) {
      if (!WZ.start || !WZ.due) { toast('تاريخ البداية وموعد الانتهاء مطلوبان'); return; }
      if (parse(WZ.due) < parse(WZ.start)) { toast('موعد الانتهاء يسبق تاريخ البداية'); return; }
    }
  }
  WZ.step = Math.min(4, Math.max(1, n));
  wzRender();
}
function wzToggle(id) {
  wzCapture();
  const i = WZ.assignees.indexOf(id);
  if (i < 0) WZ.assignees.push(id); else WZ.assignees.splice(i, 1);
  wzRender();
}
function wzCalcDue() {
  const s = document.getElementById('wzStart').value, e = +document.getElementById('wzEst').value || 1;
  const unit = document.getElementById('wzEstUnit').value;
  if (s) document.getElementById('wzDue').value = taskDurationDue(s, e, unit);
}

function wzPersonCard(u) {
  const sel = WZ.assignees.includes(u.id);
  return `<div class="person-card ${sel ? 'sel' : ''}" onclick="wzToggle('${u.id}')">
    <div class="pc-h"><div class="avatar" style="width:34px;height:34px;font-size:11px">${initials(u.name)}</div>
      <div style="min-width:0;flex:1"><div class="pc-name">${esc(u.name)}${u.id === ME.id ? ' (أنا)' : ''}</div>
        <div class="pc-role">${esc(ROLE_AR[u.role] || '')}</div></div>
      <span class="pc-check">✓</span></div>
    <div class="pc-meta" title="${esc(u.title || '')}">${esc(u.title || '—')}</div>
    <div class="pc-meta">الإدارة: ${esc(wzOrgName(u.organization))}</div>
    <div class="pc-meta">القسم: ${esc(u.dept ? dname(u.dept) : '—')}</div>
  </div>`;
}

function wzBody() {
  const opts = (arr, v) => arr.map(x => `<option value="${x.id}" ${v === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  if (WZ.step === 1) {
    const hon = wzHonorific(ME), fn = esc(wzFirstName(ME)), morn = wzIsMorning();
    return `<div class="wz-greet">
      <div class="wz-hi">${morn ? 'صباح الخير' : 'مساء الخير'} ${hon} <span class="wz-person">${fn}</span></div>
      <div class="wz-sub">${morn ? 'إنه صباح جميل!' : 'إنه مساء جميل!'}</div>
      <div class="wz-q">لمن ترغب في إسناد هذه المهمة ${hon} <span class="wz-person">${fn}</span>؟</div></div>
      ${WZ.people.length
        ? `<div class="wz-count">${nfm(WZ.people.length)} ضمن نطاق صلاحياتك · المحدد: ${nfm(WZ.assignees.length)}</div>
           <div class="people-grid">${WZ.people.map(wzPersonCard).join('')}</div>`
        : `<div class="empty">لا يوجد أشخاص يمكنك الإسناد إليهم وفق صلاحياتك وموقعك في الهيكل الإداري.</div>`}`;
  }
  if (WZ.step === 2) {
    return `<div class="form-grid">
      <div class="full"><label class="fl">اسم المهمة <span class="req">*</span></label>
        <input class="inp" id="wzTitle" value="${esc(WZ.title)}" placeholder="عنوان واضح ومحدد يعبّر عن المخرج المطلوب"></div>
      <div class="full"><label class="fl">وصف المهمة</label>
        <textarea class="inp" id="wzDesc" rows="5" placeholder="ما المطلوب بالضبط؟ ما معيار اعتبار المهمة منجزة؟">${esc(WZ.desc)}</textarea></div>
    </div>`;
  }
  if (WZ.step === 3) {
    const ro = wzCanEditDue() ? '' : 'readonly';
    return `<div class="form-grid">
      <div><label class="fl">تاريخ بداية المهمة <span class="req">*</span></label>
        <input class="inp" type="date" id="wzStart" value="${WZ.start}" onchange="wzCalcDue()"></div>
      <div><label class="fl">المدة المطلوبة للتنفيذ</label><div class="step-duration">
        <input class="inp" type="number" min="1" step="1" id="wzEst" value="${WZ.est}" onchange="wzCalcDue()">
        <select class="inp" id="wzEstUnit" onchange="wzCalcDue()">${Object.entries(TASK_DURATION_UNITS).map(([k,u])=>`<option value="${k}" ${WZ.durationUnit===k?'selected':''}>${u.label}</option>`).join('')}</select>
      </div></div>
      <div><label class="fl">موعد الانتهاء <span class="req">*</span></label>
        <input class="inp" type="date" id="wzDue" value="${WZ.due}" ${ro}>
        ${ro ? '<div class="t-meta">يُحتسب تلقائيًا — تعديله يحتاج صلاحية إدارة المهام.</div>' : ''}</div>
      <div><label class="fl">أهمية المهمة وأولويتها <span class="req">*</span></label>
        <select class="inp" id="wzPri">${opts(PRIORITIES, WZ.pri)}</select></div>
      <div class="full"><label class="fl">التصنيف</label>
        <select class="inp" id="wzCat">${opts(CATEGORIES, WZ.cat)}</select></div>
    </div>`;
  }
  const pri = (PRIORITIES.find(p => p.id === WZ.pri) || {}).name || WZ.pri;
  const cat = (CATEGORIES.find(c => c.id === WZ.cat) || {}).name || WZ.cat;
  const chips = WZ.assignees.map(id => `<span class="badge b-brand">${esc(uname(id))}</span>`).join('');
  const row = (k, v) => `<div class="wz-rw"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="wz-review">
    ${row('اسم المهمة', esc(WZ.title))}
    ${row('وصف المهمة', WZ.desc ? esc(WZ.desc) : '—')}
    ${row('المسندة إليهم', `<div class="wz-chips">${chips}</div>`)}
    ${row('تاريخ البداية', fmtDate(WZ.start))}
    ${row('المدة', nfm(WZ.est) + ' ' + TASK_DURATION_UNITS[WZ.durationUnit].label)}
    ${row('موعد الانتهاء', fmtDate(WZ.due))}
    ${row('الأهمية والأولوية', esc(pri))}
    ${row('التصنيف', esc(cat))}
  </div>
  <div class="wz-count">ستُنشأ ${nfm(WZ.assignees.length)} مهمة، واحدة لكل مسؤول، ويصل إشعار فوري لكل منهم.</div>`;
}

function wzFoot() {
  const back = WZ.step > 1 ? `<button class="btn ghost" onclick="wzGo(${WZ.step - 1})">→ رجوع</button>` : '';
  const cancel = `<button class="btn ghost" onclick="closeAll()">إلغاء</button>`;
  if (WZ.step === 1) return `<button class="btn" onclick="wzGo(2)" ${WZ.assignees.length ? '' : 'disabled'}>وصف المهمة</button>${cancel}`;
  if (WZ.step === 2) return `<button class="btn" onclick="wzGo(3)">موعد المهمة</button>${back}${cancel}`;
  if (WZ.step === 3) return `<button class="btn" onclick="wzGo(4)">مراجعة وإرسال المهمة</button>${back}${cancel}`;
  return `<button class="btn" id="wzSend" onclick="wzSubmit()">إرسال المهمة</button>${back}${cancel}`;
}

function wzRender() {
  const m = document.getElementById('modal');
  const steps = WZ_TITLES.map((t, i) => `<div class="wz-step ${WZ.step === i + 1 ? 'on' : ''} ${WZ.step > i + 1 ? 'done' : ''}">
      <span class="wz-num">${WZ.step > i + 1 ? '✓' : i + 1}</span><span class="wz-lb">${t}</span></div>`).join('');
  m.innerHTML = `<div class="modal-h"><h3>مهمة جديدة</h3>
      <span class="hint">الخطوة ${WZ.step} من ${WZ_TITLES.length}</span>
      <div style="flex:1"></div><button class="icon-btn" onclick="closeAll()">✕</button></div>
    <div class="modal-b"><div class="wz-steps">${steps}</div>${wzBody()}</div>
    <div class="modal-f">${wzFoot()}</div>`;
  if (WZ.step === 2) setTimeout(() => { const el = document.getElementById('wzTitle'); if (el) el.focus(); }, 40);
}

async function wzSubmit() {
  wzCapture();
  if (!WZ.assignees.length || !WZ.title) { toast('أكمل البيانات المطلوبة'); return; }
  const btn = document.getElementById('wzSend');
  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ الإرسال…'; }
  const ok = [], fail = [];
  for (const uid of WZ.assignees) {
    try {
      const r = await API.post('/tasks', {
        title: WZ.title, desc: WZ.desc, pri: WZ.pri, cat: WZ.cat, assignee: uid,
        start: WZ.start, est: taskDurationEstDays(WZ.est, WZ.durationUnit),
        duration: WZ.est, durationUnit: WZ.durationUnit,
        due: WZ.due, status: 'new', progress: 0, notes: '', recur: null,
      });
      upsertTask(r.task); ok.push(r.task.id);
    } catch (e) {
      if (e.message === '__session__') return;
      fail.push(`${uname(uid)}: ${e.message}`);
    }
  }
  closeAll(); renderNav(); render();
  if (ok.length) toast(`أُسندت المهمة بنجاح إلى ${nfm(ok.length)} ${ok.length === 1 ? 'مسؤول' : 'مسؤولين'} (${ok.join('، ')})`);
  if (fail.length) toast('تعذّر الإسناد — ' + fail.join(' / '));
}

/* ============================================================
   معالج إنشاء الفعالية (Wizard)
   الجهات المعروضة محكومة بـ canManageEventScope، والخادم يعيد
   التحقق عبر eventScopeAllowed عند الإنشاء.
   ============================================================ */
const EW_TITLES = ['الجهة المنظمة', 'وصف الفعالية', 'الموعد والمكان', 'مراجعة وإرسال'];
let EW = null;

/* الأقسام التي يحق للمستخدم تنظيم فعالية باسمها */
function organizableDepts() {
  return DEPTS.filter(d => canManageEventScope(d.id))
    .slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ar'));
}
function ewTypes() { return EVENT_TYPES.filter(t => t.active !== false).sort((a, b) => (a.sort || 0) - (b.sort || 0)); }

function openEventWizard() {
  const d = new Date(TODAY.getTime() + MS); d.setHours(9, 0, 0, 0);
  const types = ewTypes();
  EW = {
    step: 1, depts: organizableDepts(), organizer: '', participants: [],
    title: '', typeId: (types[0] || {}).id || '', desc: '',
    start: localDateTimeValue(d), duration: 1, unit: 'day',
    end: localDateTimeValue(new Date(d.getTime() + EVENT_UNITS.day.ms)),
    country: '', city: '', location: '', notes: '',
  };
  ewRender();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('modal').classList.add('open');
}

function ewCapture() {
  if (!EW) return;
  const g = x => { const el = document.getElementById(x); return el ? el.value : null; };
  if (EW.step === 2) {
    const t = g('ewTitle'); if (t !== null) EW.title = t.trim();
    EW.typeId = g('ewType') || EW.typeId;
    const d = g('ewDesc'); if (d !== null) EW.desc = d;
  }
  if (EW.step === 3) {
    EW.start = g('ewStart') || EW.start;
    EW.duration = Math.max(0.01, +g('ewDuration') || 0.01);
    EW.unit = g('ewUnit') || EW.unit;
    EW.end = g('ewEnd') || EW.end;
    EW.country = g('ewCountry') ?? EW.country;
    EW.city = g('ewCity') ?? EW.city;
    EW.location = g('ewLocation') ?? EW.location;
    EW.notes = g('ewNotes') ?? EW.notes;
  }
}
function ewGo(n) {
  ewCapture();
  if (n > EW.step) {
    if (EW.step === 1 && !EW.organizer) { toast('اختر الجهة المنظمة'); return; }
    if (EW.step === 2) {
      if (!EW.title) { toast('اسم الفعالية مطلوب'); return; }
      if (!EW.typeId) { toast('نوع الفعالية مطلوب'); return; }
    }
    if (EW.step === 3) {
      if (!EW.start) { toast('تاريخ ووقت البداية مطلوب'); return; }
      if (!EW.end) { toast('تاريخ ووقت النهاية مطلوب'); return; }
      if (new Date(EW.end) <= new Date(EW.start)) { toast('موعد النهاية يجب أن يلي موعد البداية'); return; }
    }
  }
  EW.step = Math.min(4, Math.max(1, n));
  ewRender();
}
function ewPickOrganizer(id) {
  ewCapture();
  EW.organizer = EW.organizer === id ? '' : id;
  EW.participants = EW.participants.filter(x => x !== EW.organizer);
  ewRender();
}
function ewToggleParticipant(id) {
  ewCapture();
  if (id === EW.organizer) return;
  const i = EW.participants.indexOf(id);
  if (i < 0) EW.participants.push(id); else EW.participants.splice(i, 1);
  ewRender();
}
function ewCalc(target) {
  const s = document.getElementById('ewStart').value, e = document.getElementById('ewEnd').value;
  const dur = +document.getElementById('ewDuration').value || 0;
  const ms = (EVENT_UNITS[document.getElementById('ewUnit').value] || EVENT_UNITS.day).ms;
  if (target === 'end' && s && dur > 0)
    document.getElementById('ewEnd').value = localDateTimeValue(new Date(new Date(s).getTime() + dur * ms));
  else if (target === 'duration' && s && e)
    document.getElementById('ewDuration').value = Math.max(0.01, Math.round(((new Date(e) - new Date(s)) / ms) * 100) / 100);
}
function ewUnitChanged() {
  const inp = document.getElementById('ewDuration');
  if (inp) inp.step = document.getElementById('ewUnit').value === 'minute' ? '1' : '.25';
  ewCalc('end');
}

function ewDeptCard(d, mode) {
  const sel = mode === 'org' ? EW.organizer === d.id : EW.participants.includes(d.id);
  const fn = mode === 'org' ? `ewPickOrganizer('${d.id}')` : `ewToggleParticipant('${d.id}')`;
  const head = d.head ? uname(d.head) : '';
  return `<div class="person-card ${sel ? 'sel' : ''}" onclick="${fn}">
    <div class="pc-h"><div class="avatar" style="width:34px;height:34px;font-size:10px">${esc((d.code || '—').replace(/^D\d+-/, ''))}</div>
      <div style="min-width:0;flex:1"><div class="pc-name">${esc(d.name)}</div>
        <div class="pc-role">${esc(wzOrgName(d.organization))}</div></div>
      <span class="pc-check">✓</span></div>
    ${head ? `<div class="pc-meta">المسؤول: ${esc(head)}</div>` : ''}
    <div class="pc-meta">الرمز: ${esc(d.code || '—')}</div>
  </div>`;
}

function ewBody() {
  const opts = (arr, v) => arr.map(x => `<option value="${x.id}" ${v === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  if (EW.step === 1) {
    const hon = wzHonorific(ME), fn = esc(wzFirstName(ME)), morn = wzIsMorning();
    if (!EW.depts.length)
      return `<div class="empty">لا توجد جهة يمكنك تنظيم فعالية باسمها وفق صلاحياتك وموقعك في الهيكل الإداري.</div>`;
    const others = EW.depts.filter(d => d.id !== EW.organizer);
    return `<div class="wz-greet">
      <div class="wz-hi">${morn ? 'صباح الخير' : 'مساء الخير'} ${hon} <span class="wz-person">${fn}</span></div>
      <div class="wz-sub">${morn ? 'إنه صباح جميل!' : 'إنه مساء جميل!'}</div>
      <div class="wz-q">أي جهة تنظّم هذه الفعالية ${hon} <span class="wz-person">${fn}</span>؟</div></div>
      <div class="wz-count">${nfm(EW.depts.length)} جهة ضمن نطاق صلاحياتك — اختر جهة منظّمة واحدة</div>
      <div class="people-grid">${EW.depts.map(d => ewDeptCard(d, 'org')).join('')}</div>
      ${EW.organizer ? `<div class="wz-q" style="margin-top:14px">جهات مشاركة في التنظيم <span class="t-meta">(اختياري)</span></div>
        <div class="wz-count">المحدد: ${nfm(EW.participants.length)}</div>
        <div class="people-grid">${others.map(d => ewDeptCard(d, 'part')).join('')}</div>` : ''}`;
  }
  if (EW.step === 2) {
    const types = ewTypes();
    return `<div class="form-grid">
      <div class="full"><label class="fl">اسم الفعالية / المناسبة <span class="req">*</span></label>
        <input class="inp" id="ewTitle" value="${esc(EW.title)}" placeholder="اسم واضح يعبّر عن الفعالية"></div>
      <div class="full"><label class="fl">نوع الفعالية / المناسبة <span class="req">*</span></label>
        <select class="inp" id="ewType">${types.length ? opts(types, EW.typeId) : '<option value="">لا توجد أنواع مفعّلة</option>'}</select>
        ${types.length ? '' : '<div class="t-meta">أضف نوع فعالية من لوحة التحكم أولًا.</div>'}</div>
      <div class="full"><label class="fl">وصف مختصر</label>
        <textarea class="inp" id="ewDesc" rows="4" placeholder="ما هدف الفعالية؟ ومن الفئة المستهدفة؟">${esc(EW.desc)}</textarea></div>
    </div>`;
  }
  if (EW.step === 3) {
    return `<div class="form-grid">
      <div><label class="fl">تاريخ ووقت البداية <span class="req">*</span></label>
        <input class="inp" type="datetime-local" id="ewStart" value="${EW.start}" onchange="ewCalc('end')"></div>
      <div><label class="fl">مدة الفعالية</label>
        <div class="step-duration"><input class="inp" type="number" min="0.01" step="${EW.unit === 'minute' ? '1' : '.25'}" id="ewDuration" value="${EW.duration}" onchange="ewCalc('end')">
        <select class="inp" id="ewUnit" onchange="ewUnitChanged()">${Object.entries(EVENT_UNITS).map(([k, u]) => `<option value="${k}" ${EW.unit === k ? 'selected' : ''}>${u.label}</option>`).join('')}</select></div></div>
      <div><label class="fl">تاريخ ووقت النهاية <span class="req">*</span></label>
        <input class="inp" type="datetime-local" id="ewEnd" value="${EW.end}" onchange="ewCalc('duration')"></div>
      <div><label class="fl">الدولة</label><input class="inp" id="ewCountry" value="${esc(EW.country)}"></div>
      <div><label class="fl">المدينة</label><input class="inp" id="ewCity" value="${esc(EW.city)}"></div>
      <div class="full"><label class="fl">الموقع التفصيلي / مقر الفعالية</label><input class="inp" id="ewLocation" value="${esc(EW.location)}"></div>
      <div class="full"><label class="fl">ملاحظات إضافية</label><textarea class="inp" id="ewNotes" rows="3">${esc(EW.notes)}</textarea></div>
    </div>`;
  }
  const typeName = (ewTypes().find(t => t.id === EW.typeId) || {}).name || '—';
  const org = (DEPTS.find(d => d.id === EW.organizer) || {}).name || '—';
  const parts = EW.participants.map(id => `<span class="badge b-blue">${esc(dname(id))}</span>`).join('') || '<span class="t-meta">لا يوجد</span>';
  const unit = (EVENT_UNITS[EW.unit] || EVENT_UNITS.day).label;
  const place = [EW.country, EW.city, EW.location].map(x => String(x || '').trim()).filter(Boolean).join(' – ') || '—';
  const row = (k, v) => `<div class="wz-rw"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="wz-review">
    ${row('اسم الفعالية', esc(EW.title))}
    ${row('النوع', esc(typeName))}
    ${row('الوصف', EW.desc ? esc(EW.desc) : '—')}
    ${row('الجهة المنظمة', esc(org))}
    ${row('الجهات المشاركة', `<div class="wz-chips">${parts}</div>`)}
    ${row('بداية الفعالية', fmtEventDT(EW.start))}
    ${row('المدة', nfm(EW.duration) + ' ' + esc(unit))}
    ${row('نهاية الفعالية', fmtEventDT(EW.end))}
    ${row('المكان', esc(place))}
    ${EW.notes ? row('ملاحظات', esc(EW.notes)) : ''}
  </div>
  <div class="wz-count">سيصل تنبيه بالفعالية إلى مديري الإدارات تلقائيًا بعد الحفظ.</div>`;
}

function ewFoot() {
  const back = EW.step > 1 ? `<button class="btn ghost" onclick="ewGo(${EW.step - 1})">→ رجوع</button>` : '';
  const cancel = `<button class="btn ghost" onclick="closeAll()">إلغاء</button>`;
  if (EW.step === 1) return `<button class="btn" onclick="ewGo(2)" ${EW.organizer ? '' : 'disabled'}>وصف الفعالية</button>${cancel}`;
  if (EW.step === 2) return `<button class="btn" onclick="ewGo(3)">موعد الفعالية</button>${back}${cancel}`;
  if (EW.step === 3) return `<button class="btn" onclick="ewGo(4)">مراجعة وحفظ الفعالية</button>${back}${cancel}`;
  return `<button class="btn" id="ewSend" onclick="ewSubmit()">حفظ الفعالية</button>${back}${cancel}`;
}

function ewRender() {
  const m = document.getElementById('modal');
  const steps = EW_TITLES.map((t, i) => `<div class="wz-step ${EW.step === i + 1 ? 'on' : ''} ${EW.step > i + 1 ? 'done' : ''}">
      <span class="wz-num">${EW.step > i + 1 ? '✓' : i + 1}</span><span class="wz-lb">${t}</span></div>`).join('');
  m.innerHTML = `<div class="modal-h"><h3>فعالية جديدة</h3>
      <span class="hint">الخطوة ${EW.step} من ${EW_TITLES.length}</span>
      <div style="flex:1"></div><button class="icon-btn" onclick="closeAll()">✕</button></div>
    <div class="modal-b"><div class="wz-steps">${steps}</div>${ewBody()}</div>
    <div class="modal-f">${ewFoot()}</div>`;
  if (EW.step === 2) setTimeout(() => { const el = document.getElementById('ewTitle'); if (el) el.focus(); }, 40);
}

async function ewSubmit() {
  ewCapture();
  if (!EW.organizer || !EW.title || !EW.typeId) { toast('أكمل البيانات المطلوبة'); return; }
  const btn = document.getElementById('ewSend');
  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ الحفظ…'; }
  const r = await run(() => API.post('/events', {
    title: EW.title, typeId: EW.typeId, organizerDept: EW.organizer, summary: EW.desc,
    startAt: EW.start, endAt: EW.end, duration: EW.duration, durationUnit: EW.unit,
    country: EW.country, city: EW.city, location: EW.location,
    participants: EW.participants, notes: EW.notes,
  }), 'أُضيفت الفعالية بنجاح');
  if (!r) { if (btn) { btn.disabled = false; btn.textContent = 'حفظ الفعالية'; } return; }
  upsertEvent(r.event);
  closeAll(); renderNav(); render();
}

/* ============================================================
   الفلاتر المحفوظة
   ============================================================ */
async function saveFilter() {
  const name = prompt('اسم الفلتر المحفوظ:'); if (!name) return;
  const r = await run(() => API.post('/filters', { name, f: { ...F } }), 'حُفظ الفلتر');
  if (r) { SAVED_FILTERS.push({ id: r.id, name, f: { ...F } }); render(); }
}

/* ============================================================
   لوحة التحكم — القوائم المرجعية
   ============================================================ */
const META_KIND = { CATEGORIES: 'categories', DEPTS: 'departments', STATUSES: 'statuses', PRIORITIES: 'priorities' };
const META_ARR = () => ({ CATEGORIES, DEPTS, STATUSES, PRIORITIES });

async function addItem(v) {
  const name = prompt('الاسم الجديد:'); if (!name) return;
  const body = { name };
  if (v === 'DEPTS') { body.organization = ORGANIZATIONS[0]?.id; body.code=prompt('رمز القسم:'); if(!body.code)return; }
  if (v === 'PRIORITIES') Object.assign(body, { cls: 'b-gray', color: 'var(--gray)', rank: 1 });
  if (v === 'STATUSES') Object.assign(body, { cls: 'b-gray', color: 'var(--gray)', open: true });
  const r = await run(() => API.post(`/admin/meta/${META_KIND[v]}`, body), 'أُضيف بنجاح');
  if (r) { META_ARR()[v].push({ id: r.id, name, ...body, open: body.open }); render(); }
}
async function editItem(v, i, val) {
  const arr = META_ARR()[v]; const it = arr[i]; const old = it.name;
  it.name = val;
  const r = await run(() => API.patch(`/admin/meta/${META_KIND[v]}/${it.id}`, { name: val }), 'تم التعديل');
  if (!r) { it.name = old; render(); }
}
async function delItem(v, i) {
  const arr = META_ARR()[v]; const it = arr[i];
  const r = await run(() => API.del(`/admin/meta/${META_KIND[v]}/${it.id}`), 'تم الحذف');
  if (r) { arr.splice(i, 1); render(); }
}
async function addCF() {
  const name = prompt('اسم الحقل:'); if (!name) return;
  const type = prompt('النوع (text, number, date, select, multi, bool, user, dept, url, file):', 'text');
  if (!FT[type]) { toast('نوع غير معروف'); return; }
  const req = confirm('هل الحقل إلزامي؟');
  const r = await run(() => API.post('/admin/meta/custom_fields', { name, type, req, cats: [] }), 'أُضيف الحقل');
  if (r) { CUSTOM_FIELDS.push({ id: r.id, name, type, req, cats: [] }); render(); }
}
async function delCF(i) {

/* المرشحون لمنصب قيادي: الخادم يشترط دور «مدير إدارة» للإدارة
   و«رئيس قسم» للقسم، فلا نعرض إلا من يحمل الدور المطلوب. */
function leaderCandidates(role, currentEmployeeNo) {
  const all = [...USERS, ...HIDDEN_USERS];
  const list = all.filter(u => u.role === role && u.employeeNo);
  if (currentEmployeeNo && !list.some(u => String(u.employeeNo) === String(currentEmployeeNo))) {
    const cur = all.find(u => String(u.employeeNo) === String(currentEmployeeNo));
    if (cur) list.push(cur);
  }
  return list.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ar'));
}
function leaderOptions(role, current) {
  const list = leaderCandidates(role, current);
  const opts = list.map(u => `<option value="${esc(u.employeeNo)}" ${String(u.employeeNo) === String(current) ? 'selected' : ''}>${esc(u.name)} — ${esc(u.employeeNo)}${u.title ? ' — ' + esc(u.title) : ''}</option>`).join('');
  return `<option value="">بدون</option>${opts}`;
}

function structurePersonUser(p) {
  if (!p) return null;
  if (p.linkedUserId) {
    const u = [...USERS, ...HIDDEN_USERS].find(x => x.id === p.linkedUserId);
    if (u) return u;
  }
  return [...USERS, ...HIDDEN_USERS].find(x => String(x.employeeNo || '') === String(p.employeeNo || '')) || null;
}

let IMPORT_ROWS = [], IMPORT_RESULTS = null;

const HEADER_MAP = {
  'الاسم':'name','اسم الموظف':'name','الاسم الكامل':'name','name':'name','full name':'name',
  'البريد':'email','البريد الإلكتروني':'email','البريد الالكتروني':'email','الايميل':'email','الإيميل':'email','email':'email',
  'الإدارة':'dept','الادارة':'dept','القسم':'dept','الإدارة/القسم':'dept','department':'dept','dept':'dept',
  'الدور':'role','الصلاحية':'role','role':'role',
  'المسمى':'title','المسمى الوظيفي':'title','title':'title','job title':'title',
  'كلمة المرور':'password','password':'password',
  'الجوال':'phone','رقم الجوال':'phone','الهاتف':'phone','الموبايل':'phone','phone':'phone','mobile':'phone',
};

/** يقبل الفواصل أو الجدولة (لصق مباشر من Excel)، ويتعرّف على الترويسة العربية أو الإنجليزية */
function parseDelimited(text) {
  const lines = String(text || '').split(/\r?\n/).filter((l) => l.trim() !== '');
  if (!lines.length) return { rows: [], error: 'الملف فارغ.' };
  const delim = (lines[0].match(/\t/g) || []).length >= (lines[0].match(/,/g) || []).length ? '\t' : ',';
  const split = (line) => {
    if (delim === '\t') return line.split('\t');
    const out = []; let cur = '', qd = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { if (qd && line[i + 1] === '"') { cur += '"'; i++; } else qd = !qd; }
      else if (c === ',' && !qd) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur); return out;
  };
  const head = split(lines[0]).map((h) => h.trim().replace(/^\ufeff/, '').toLowerCase());
  const cols = head.map((h) => HEADER_MAP[h] || HEADER_MAP[h.replace(/\s+/g, ' ')] || null);
  if (!cols.includes('name') || !cols.includes('email'))
    return { rows: [], error: 'الترويسة يجب أن تحتوي على عمودَي «الاسم» و«البريد الإلكتروني» على الأقل.' };
  const rows = lines.slice(1).map((l) => {
    const p = split(l), o = {};
    cols.forEach((c, i) => { if (c) o[c] = (p[i] || '').trim().replace(/^"|"$/g, ''); });
    return o;
  }).filter((o) => o.name || o.email);
  return { rows };
}

const STEP_STATUS = { pending: ['لم يبدأ', 'b-blue'], doing: ['جارٍ التنفيذ', 'b-amber'], done: ['منجز', 'b-green'], blocked: ['متعثر', 'b-red'] };
const STEP_UNITS = {
  minute: { one: 'دقيقة', label: 'دقيقة', ms: 60000 },
  hour: { one: 'ساعة', label: 'ساعة', ms: 3600000 },
  day: { one: 'يوم', label: 'يوم', ms: 86400000 },
  week: { one: 'أسبوع', label: 'أسبوع', ms: 604800000 },
};
function stepAt(x, key) {
  const v = x[key + 'At'] || x[key];
  if (!v) return null;
  return new Date(/^\d{4}-\d{2}-\d{2}$/.test(v) ? `${v}T${key === 'due' ? '23:59' : '00:00'}` : v);
}
function stepDueMs(x) { const d = stepAt(x, 'due'); return d && !Number.isNaN(d.getTime()) ? d.getTime() : null; }
function stepIsLate(x) { const due = stepDueMs(x); return x.status !== 'done' && due !== null && Date.now() > due; }
function stepDelayMs(x) { const due = stepDueMs(x); return due === null ? 0 : Math.max(0, Date.now() - due); }
function stepRemainingMs(x) { const due = stepDueMs(x); return due === null ? 0 : Math.max(0, due - Date.now()); }
function stepCount(n, one, two, few) {
  const v = nfm(n);
  if (n === 1) return one;
  if (n === 2) return two;
  return `${v} ${n >= 3 && n <= 10 ? few : one}`;
}
function formatStepSpan(ms) {
  const mins = Math.max(1, Math.round(ms / 60000));
  if (mins < 60) return stepCount(mins, 'دقيقة واحدة', 'دقيقتين', 'دقائق');
  const hours = Math.round(mins / 60);
  if (hours < 24) return stepCount(hours, 'ساعة واحدة', 'ساعتين', 'ساعات');
  const days = Math.round(hours / 24);
  if (days < 7) return stepCount(days, 'يوم واحد', 'يومين', 'أيام');
  const weeks = Math.round(days / 7);
  return stepCount(weeks, 'أسبوع واحد', 'أسبوعين', 'أسابيع');
}
function formatStepDuration(x) {
  const unit = STEP_UNITS[x.durationUnit || 'day'] || STEP_UNITS.day;
  return `${nfm(x.duration == null ? x.days : x.duration)} ${unit.label}`;
}
function fmtStepDateTime(v) {
  if (!v) return '—';
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? '—' : d.toLocaleString('ar-SA-u-ca-gregory-nu-latn', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', numberingSystem:'latn' });
}
function localDateTimeValue(d) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

        </div>
        ${overdue?`<div class="exec-delay-card"><span>🚨</span><div class="txt"><b>الإجراء تجاوز موعده المحدد</b><div class="note">${x.delayNote?esc(x.delayNote):'لم تُسجّل ملاحظة للتأخير بعد.'}</div></div><button class="btn ghost sm" onclick="openStepDelay(${x.id})">التفاصيل</button></div>`:''}

      <div class="exec-summary-stat"><div class="v" style="color:var(--amber)">${nfm(doing)}</div><div class="k">قيد التنفيذ</div></div>

function stCalc(target) {
  const s = document.getElementById('stStart').value, d = +document.getElementById('stDuration').value;
  const u = document.getElementById('stDue').value, unit = document.getElementById('stUnit').value;
  const unitMs = STEP_UNITS[unit].ms;
  if (target === 'due' && s && d > 0) document.getElementById('stDue').value = localDateTimeValue(new Date(new Date(s).getTime() + d * unitMs));
  else if (target === 'duration' && s && u) document.getElementById('stDuration').value = Math.max(.01, Math.round(((new Date(u)-new Date(s))/unitMs)*100)/100);
}
function stUnitChanged() {
  const unit = document.getElementById('stUnit').value, inp = document.getElementById('stDuration');
  inp.step = unit === 'minute' ? '1' : '.25';
  stCalc('due');
}

  if (r) { closeModal(); TAB = 'sub'; upsertTask(r.task); }
}

function reassign() {
  const t = CUR;
  // مدير النظام يُسند لأي موظف؛ المدير داخل إدارته فقط
  const pool = ME.role === 'admin' ? USERS.filter(u=>['manager','employee'].includes(u.role)) : ['secretary_general','assistant_secretary_general'].includes(ME.role)
    ? USERS.filter(u=>u.role==='director'&&(!ME.organization||u.organization===ME.organization)) : ME.role === 'director'
    ? USERS.filter((u) => u.organization === ME.organization && ['manager','employee'].includes(u.role))
    : USERS.filter((u) => u.dept === ME.dept && u.role === 'employee');
  const byDept = {};
  pool.filter((u) => u.id !== t.assignee).forEach((u) => { (byDept[u.dept] = byDept[u.dept] || []).push(u); });

  const m = document.getElementById('modal');
  m.innerHTML = `
  <div class="modal-h"><h3>إعادة إسناد المهمة</h3><div style="flex:1"></div>
    <button class="icon-btn" onclick="closeAll()">✕</button></div>
  <div class="modal-b">
    <div class="alert info"><span>⇄</span><div>المهمة الآن مع <b>${esc(uname(t.assignee))}</b> — ${esc(dname(t.dept))}.
      ${ME.role === 'admin' ? 'بصفتك مدير النظام يمكنك الإسناد عبر جميع الإدارات.' : ME.role==='director' ? 'يمكنك الإسناد لرؤساء الأقسام والموظفين داخل إدارتك فقط.' : 'يمكنك الإسناد لموظفي قسمك فقط.'}</div></div>
    <label class="fl">ابحث</label>
    <input class="inp" id="raSearch" placeholder="اكتب اسم الموظف…" oninput="raFilter(this.value)">
    <div id="raList" style="max-height:38vh;overflow:auto;margin-top:10px"></div>
    <label class="fl" style="margin-top:14px">سبب إعادة الإسناد (يُسجَّل في سجل المهمة)</label>
    <input class="inp" id="raReason" placeholder="مثال: إعادة توزيع الأحمال بعد تكليف طارئ">
  </div>
  <div class="modal-f"><button class="btn" onclick="doReassign()">تأكيد إعادة الإسناد</button>
    <button class="btn ghost" onclick="closeAll()">إلغاء</button></div>`;
  document.getElementById('overlay').classList.add('open');
  m.classList.add('open');
  RA_POOL = byDept; RA_SEL = null;
  raFilter('');
}
let RA_POOL = {}, RA_SEL = null;
function raFilter(q) {
  q = (q || '').trim();
  const el = document.getElementById('raList');
  let html = '';
  for (const [d, list] of Object.entries(RA_POOL)) {
    const f = list.filter((u) => !q || u.name.includes(q) || (u.title || '').includes(q));
    if (!f.length) continue;
    html += `<div class="nav-group" style="padding:8px 4px 4px">${esc(dname(d))}</div>`;
    html += f.map((u) => {
      const k = empKPI(u.id);
      return `<button class="preset ${RA_SEL === u.id ? 'sel' : ''}" style="${RA_SEL === u.id ? 'border-color:var(--brand);background:var(--brand-soft)' : ''}"
        onclick="RA_SEL='${u.id}';raFilter(document.getElementById('raSearch').value)">
        <div class="avatar" style="width:28px;height:28px;font-size:10.5px">${initials(u.name)}</div>
        <div style="flex:1;text-align:right"><div style="font-weight:600;font-size:12.6px">${esc(u.name)}</div>
          <div class="t-meta">${esc(u.title || ROLE_AR[u.role])}</div></div>
        <div class="t-meta nowrap">${k ? `${nfm(k.open)} مهمة مفتوحة${k.late ? ` · <span style="color:var(--red)">${nfm(k.late)} متأخرة</span>` : ''}` : 'بلا مهام'}</div>
      </button>`;
    }).join('');
  }
  el.innerHTML = html || '<div class="empty">لا يوجد موظفون مطابقون ضمن صلاحيتك.</div>';
}
async function doReassign() {
  if (!RA_SEL) { toast('اختر الموظف أولًا'); return; }
  const reason = document.getElementById('raReason').value.trim();
  const r = await run(() => act(CUR.id, 'reassign', RA_SEL, reason), 'أُعيد الإسناد');
  if (r) { closeModal(); upsertTask(r.task); }
}

async function saveNotifPreferences() {
  const on = (id) => !!(document.getElementById(id) || {}).checked;

async function planUpload(inp) {
  const f = inp.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  inp.value = '';
  const r = await run(() => API.form('/admin/plan/parse', fd));
  if (!r) return;
  if (!r.rows.length) { toast(r.warning || 'لم يُعثر على أنشطة.'); return; }
  // اقتراح القسم والمسؤول تلقائيًا من اسم القسم المنفّذ في الخطة
  r.rows.forEach((x) => {
    const d = matchDept(x.deptName);
    x.dept = d ? d.id : '';
    x.assignee = d ? suggestHead(d.id) : '';
    x.cat = 'plan';
    x.pri = 'medium';
    x.selected = false;
  });
  PLAN = { rows: r.rows, year: PLAN.year, organization:PLAN.organization, results: null, source: r.source, sheets: r.sheets || [], warning: r.warning };
  render();
  toast(r.warning, 'long');
}
const norm = (s) => String(s || '').replace(/\s+/g, '').replace(/^قسم|^إدارة/, '');
function matchDept(name) {
  if (!name) return null;
  const n = norm(name);
  const pool=DEPTS.filter(d=>d.organization===PLAN.organization);
  return pool.find((d) => norm(d.name) === n) || pool.find((d) => norm(d.name).includes(n) || n.includes(norm(d.name))) || null;
}
/** يقترح رئيس القسم: أول مدير في الإدارة، وإلا مدير النظام */
/** يقترح رئيس القسم فقط. لا يوجد رئيس؟ يُترك فارغًا ليختاره المسؤول عمدًا
    — الإسناد التلقائي لمدير النظام يُغرقه بعشرات المهام دون قصد. */
function suggestHead(deptId) {
  const m = USERS.find((u) => u.dept === deptId && u.role === 'manager');
  if (m) return m.id;
  const a = USERS.find((u) => u.dept === deptId && u.role === 'admin');
  return a ? a.id : '';
}

/** الأقسام المطلوبة في الخطة ولا رئيس قسم لها في النظام */
function planHeadlessDepts() {
  const ids = [...new Set(PLAN.rows.map((x) => x.dept).filter(Boolean))];
  return ids.filter((id) => !USERS.some((u) => u.dept === id && (u.role === 'manager' || u.role === 'admin')))
            .map((id) => dname(id));
}

        </select></td>

/** تصنيف «الخطة السنوية» يُنشئه الخادم عند أول استيراد، فنعرضه هنا ولو لم يصل بعد */
function planCats() {
  return CATEGORIES.some((c) => c.id === 'plan')
    ? CATEGORIES
    : [{ id: 'plan', name: 'برنامج/نشاط من الخطة السنوية' }, ...CATEGORIES];
}
function planSetDept(i, v) {
  PLAN.rows[i].dept = v;
  PLAN.rows[i].assignee = v ? suggestHead(v) : '';
  render();
}
function planBulkAssign() {
  let n = 0;
  PLAN.rows.forEach((x) => {
    if (!x.dept) { const d = matchDept(x.deptName); if (d) { x.dept = d.id; n++; } }
    if (x.dept && !x.assignee) { x.assignee = suggestHead(x.dept); n++; }
  });
  render();
  toast(n ? `عُيّن ${nfm(n)} حقلًا تلقائيًا` : 'لا يوجد ما يمكن تعيينه تلقائيًا — حدّد الأقسام يدويًا');
}
function planSelectProgram(program){
  if(!program)return;PLAN.rows.forEach(x=>x.selected=x.program===program);render();
  toast(`تم تحديد ${nfm(PLAN.rows.filter(x=>x.selected).length)} نشاطًا من البرنامج`);
}
function openPlanBulkSelected(){
  const selected=PLAN.rows.filter(x=>x.selected);if(!selected.length){toast('حدد برنامجًا أو نشاطًا واحدًا على الأقل');return;}
  const heads=USERS.filter(u=>u.role==='manager'&&u.organization===PLAN.organization);
  if(!heads.length){toast('لا يوجد رؤساء أقسام مسجلون في هذه الإدارة');return;}
  const m=document.getElementById('modal');m.innerHTML=`<div class="modal-h"><h3>إسناد جماعي إلى رئيس قسم</h3><div style="flex:1"></div><button class="icon-btn" onclick="closeAll()">✕</button></div><div class="modal-b"><div class="alert info"><span>✓</span><div>سيتم إسناد <b>${nfm(selected.length)}</b> برنامجًا/نشاطًا محددًا دفعة واحدة.</div></div><label class="fl">رئيس القسم</label><select class="inp" id="planBulkHead">${heads.map(u=>`<option value="${u.id}">${esc(u.name)} — ${esc(dname(u.dept))}</option>`).join('')}</select></div><div class="modal-f"><button class="btn" onclick="applyPlanBulkSelected()">تطبيق الإسناد</button><button class="btn ghost" onclick="closeAll()">إلغاء</button></div>`;document.getElementById('overlay').classList.add('open');m.classList.add('open');
}
function applyPlanBulkSelected(){
  const id=document.getElementById('planBulkHead').value,u=USERS.find(x=>x.id===id);if(!u)return;
  let n=0;PLAN.rows.forEach(x=>{if(x.selected){x.assignee=u.id;x.dept=u.dept;x.selected=false;n++;}});closeAll();render();toast(`أُسند ${nfm(n)} نشاطًا إلى ${u.name}`);
}

async function planCheck() {
  const r = await run(() => API.post('/admin/plan/import', { year: PLAN.year, organization:PLAN.organization, rows: PLAN.rows, dryRun: true }));
  if (!r) return;
  PLAN.results = r; render();
  const el = document.getElementById('planResults'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
async function planRun() {
  if (!confirm(`سيتم إنشاء المهام وإسنادها فورًا، وسيصل كل رئيس قسم تنبيه بمهامه. متابعة؟`)) return;
  const r = await run(() => API.post('/admin/plan/import', { year: PLAN.year, organization:PLAN.organization, rows: PLAN.rows, dryRun: false }));
  if (!r) return;
  PLAN.results = r;
  const [b,tb] = await Promise.all([API.get('/bootstrap'),API.get('/tasks')]);
  TASKS = tb.tasks || []; CATEGORIES = b.categories || CATEGORIES; CUSTOM_FIELDS = b.customFields || CUSTOM_FIELDS;
  renderNav(); render();
  toast(`أُنشئت ${nfm(r.summary.created || 0)} مهمة من الخطة`);
}

function planResultsCard() {
  const r = PLAN.results, S = r.summary || {};
  const badge = { ready: 'b-blue', created: 'b-green', skipped: 'b-gray', error: 'b-red' };
  const label = { ready: 'جاهزة', created: 'أُنشئت', skipped: 'متجاوَزة', error: 'خطأ' };
  return `
  <div class="card" style="margin-top:13px" id="planResults"><div class="card-h">
    <h3>${r.dryRun ? '٣. نتيجة الفحص' : '✔ اكتمل الاستيراد'}</h3>
    <div style="flex:1"></div>
    ${r.dryRun && (S.ready || 0) ? `<button class="btn sm" onclick="planRun()">إنشاء ${nfm(S.ready)} مهمة وإسنادها</button>` : ''}
  </div><div class="card-b">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      ${Object.entries(S).map(([k, v]) => `<span class="badge ${badge[k] || 'b-gray'}">${label[k] || k}: ${nfm(v)}</span>`).join('')}
    </div>
    ${r.dryRun
      ? `<div class="alert info"><span>🔍</span><div>لم تُنشأ أي مهمة بعد.
          ${(S.error || 0) ? `صحّح <b>${nfm(S.error)}</b> صفًا، أو تابع لإنشاء الصفوف السليمة فقط.` : 'جميع الصفوف سليمة.'}</div></div>`
      : `<div class="alert info"><span>✅</span><div>أُنشئت المهام وأُسندت، وأُرسل لكل رئيس قسم تنبيه بمهامه.
          يتولّى كل رئيس قسم توزيعها على موظفيه عبر «إعادة الإسناد» داخل كل مهمة.</div></div>`}
    <div class="tbl-wrap" style="max-height:40vh;overflow:auto"><table class="tbl" style="min-width:620px"><thead><tr>
      <th>#</th><th>النشاط</th><th>القسم</th><th>المسؤول</th><th>الفترة</th><th>الإجراءات</th><th>الحالة</th><th>الملاحظة</th>
    </tr></thead><tbody>
    ${r.results.map((x) => `<tr style="cursor:${x.id ? 'pointer' : 'default'}" ${x.id ? `onclick="go('all');setTimeout(()=>openTask('${x.id}'),300)"` : ''}>
      <td>${x.row}</td><td class="t-title">${esc(x.activity)}</td>
      <td class="nowrap">${esc(x.dept || '—')}</td><td class="nowrap">${esc(x.assignee || '—')}</td>
      <td class="nowrap t-meta">${x.start ? `${fmtShort(x.start)} → ${fmtShort(x.due)}` : '—'}</td>
      <td>${x.steps ? nfm(x.steps) : '—'}</td>
      <td><span class="badge ${badge[x.status]}">${label[x.status]}</span></td>
      <td class="t-meta">${esc(x.message)}</td>
    </tr>`).join('')}
    </tbody></table></div>
  </div></div>`;
}

/* ---------- سجل الدخول (يُجلب من الخادم) ---------- */
async function loadLogins() {
  if (!ME || ME.role !== 'admin') return;
  const r = await API.get('/admin/logins').catch(() => null);
  if (r) { LOGIN_LOG = r.logins; const el = document.getElementById('loginLog'); if (el) el.innerHTML = loginRows(); }
}
const loginRows = () =>
  LOGIN_LOG.length
    ? LOGIN_LOG.slice(0, 15).map((l) => `<div class="set-row">
        <span class="badge ${l.ok ? 'b-green' : 'b-red'}">${l.ok ? 'ناجحة' : 'مرفوضة'}</span>
        <span style="flex:1;direction:ltr;text-align:right;font-size:12px">${esc(l.email)}</span>
        <span class="t-meta nowrap">${esc(l.reason || '—')}</span>
        <span class="t-meta nowrap">${fmtDT(l.at)}</span></div>`).join('')
    : '<div class="empty">لا توجد محاولات مسجّلة.</div>';

/* ---------- سجل النشاط العام (من الخادم) ---------- */
async function loadActivity() {
  if (!ME) return;
  const r = await API.get('/activity').catch(() => null);
  if (!r) return;
  const ICO = { create: '＋', status: '⇄', progress: '％', extend: '⏱', done: '✓', comment: '💬', assign: '⇄', edit: '✎', admin: '⚙', security: '🔒', delete: '✕' };
  const el = document.getElementById('auditBody');
  if (el) el.innerHTML = r.activity.map((l) => `<div class="log">
      <div class="li">${ICO[l.type] || '•'}</div>
      <div style="flex:1;min-width:0">
        <div><b>${esc(uname(l.by))}</b> — ${esc(l.txt)}</div>
        <div class="lt">${l.taskId ? `${esc(l.taskTitle || '')} · <span style="color:var(--brand);cursor:pointer" onclick="openTask('${l.taskId}')">${l.taskId}</span> · ` : ''}${fmtDT(l.at)}</div>
      </div></div>`).join('') || '<div class="empty">لا توجد سجلات.</div>';
}
function vAudit() {
  setTimeout(loadActivity, 30);
  return `<div class="card"><div class="card-h"><h3>سجل النشاط والتعديلات</h3>
    <span class="hint">سجل غير قابل للتعديل أو الحذف — يشمل الإجراءات الإدارية</span></div>
    <div class="card-b" id="auditBody"><div class="empty">جارٍ التحميل…</div></div></div>`;
}

/* ============================================================
   تغيير كلمة المرور
   ============================================================ */
function openPasswordModal() {
  const m = document.getElementById('modal');
  m.classList.add('password-modal');
  m.innerHTML = `
  <div class="modal-h"><h3>تغيير كلمة المرور</h3><div style="flex:1"></div>
    <button class="icon-btn" onclick="closeAll()">✕</button></div>
  <div class="modal-b">
    <div class="alert info"><span>🔒</span><div>اختر كلمة مرور لا تقل عن 10 أحرف وتجمع بين حروف وأرقام، ولا تستخدمها في أي نظام آخر.</div></div>
    <div class="field"><label class="fl">كلمة المرور الحالية</label><input class="inp" type="password" id="pwCur"></div>
    <div class="field"><label class="fl">كلمة المرور الجديدة</label><input class="inp" type="password" id="pwNew"></div>
    <div class="field"><label class="fl">تأكيد كلمة المرور الجديدة</label><input class="inp" type="password" id="pwCnf"></div>
    <div class="err" id="pwErr"></div>
  </div>
  <div class="modal-f"><button class="btn" onclick="submitPassword()">حفظ</button>
    <button class="btn ghost" onclick="closeAll()">لاحقًا</button></div>`;
  document.getElementById('overlay').classList.add('open');
  m.classList.add('open');
}
async function submitPassword() {
  const cur = document.getElementById('pwCur').value;
  const nw = document.getElementById('pwNew').value;
  const cf = document.getElementById('pwCnf').value;
  const err = document.getElementById('pwErr');
  if (nw !== cf) { err.textContent = 'كلمتا المرور غير متطابقتين.'; return; }
  busy(true);
  try {
    await API.post('/admin/account/password', { current: cur, next: nw });
    closeAll(); toast('تم تغيير كلمة المرور');
  } catch (e) { if (e.message !== '__session__') err.textContent = e.message; }
  finally { busy(false); }
}

/* ============================================================
   الإقلاع
   ============================================================ */
(async function init() {
  installLatinDigitNormalization();
  applyBrand();
  document.getElementById('lgPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('lgEmail').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('lgPass').focus(); });
  try {
    const r = await fetch('/api/auth/me', { credentials: 'same-origin' });
    if (r.ok) { const d = await r.json(); await boot(d.user, false); return; }
  } catch (e) { /* لا جلسة */ }
  renderDemo();
})();

</script>
