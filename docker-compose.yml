services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wamy_tasks
      POSTGRES_USER: wamy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?اضبط POSTGRES_PASSWORD في ملف .env}
      LANG: ar_SA.utf8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wamy -d wamy_tasks"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wamy:${POSTGRES_PASSWORD}@db:5432/wamy_tasks
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
